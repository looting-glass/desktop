name: Release

on:
  push:
    tags: ["v*"]
  # Manual run = dry run: builds and uploads the tarball as an artifact, no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch packages current Qt 6, LayerShellQt and Kirigami; Qt 6 is backward compatible,
    # so the binary keeps working as users' Qt updates.
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust \
            qt6-base qt6-declarative layer-shell-qt kirigami qqc2-desktop-style

      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release --locked

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"
          tarball="$(packaging/make-release.sh "$version" | tail -1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lootlens-dev
          path: dist/*.tar.gz*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          generate_release_notes: true
