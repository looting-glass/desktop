name: Release

on:
  push:
    tags: ["v*"]
  # Manual run = dry run: builds both platforms and uploads them as artifacts, no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Arch packages current Qt 6, LayerShellQt and Kirigami; Qt 6 is backward compatible,
    # so the binary keeps working as users' Qt updates.
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust \
            qt6-base qt6-declarative layer-shell-qt kirigami qqc2-desktop-style

      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"
          packaging/make-release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: lootlens-linux
          path: dist/*.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSVC environment (cl.exe for the C++ bootstrap, VCINSTALLDIR for windeployqt's
      # --compiler-runtime).
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Test
        run: cargo test --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME"
          if ("$env:GITHUB_REF_TYPE" -ne "tag") {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value + "-dev"
          }
          $version = $version.TrimStart("v")
          $name = "lootlens-$version-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/lootlens.exe $dir/
          windeployqt --release --qmldir qml --no-translations --compiler-runtime "$dir/lootlens.exe"
          # SVG icons (app icon, fallback UI icons) need the SVG image/icon plugins.
          New-Item -ItemType Directory -Force "$dir/imageformats", "$dir/iconengines" | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/bin/Qt6Svg.dll" $dir/
          Copy-Item "$env:QT_ROOT_DIR/plugins/imageformats/qsvg.dll" "$dir/imageformats/"
          Copy-Item "$env:QT_ROOT_DIR/plugins/iconengines/qsvgicon.dll" "$dir/iconengines/"
          Copy-Item README.md, LICENSE.md $dir/
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lootlens-windows
          path: dist/*.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
