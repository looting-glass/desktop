name: Release

# After every push to main, release-please updates a release PR (version bump in Cargo.toml +
# CHANGELOG.md, from Conventional Commit titles). Merging that PR tags vX.Y.Z and creates the
# GitHub release as a draft; the jobs below build both platforms, attach the downloads and only
# then publish it. Until then the release is invisible to `releases/latest`, which the in-app
# update check and the website read, so nobody is offered a release without its files. If a
# build fails, the release stays a draft: re-run the failed jobs to finish it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags pushed with the workflow token don't trigger other workflows, so build from here.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

      # The website's download buttons and changelog come from the latest release, filled in
      # at deploy time. Deploy it now that the release is published with its files. The token is a fine-grained
      # PAT with Actions read/write on looting-glass.github.io; without it this step is skipped
      # and the site's daily deploy picks the release up instead.
      - name: Refresh the website
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DEPLOY_TOKEN is not set; the website picks this release up on its daily deploy"
            exit 0
          fi
          gh workflow run Pages --repo looting-glass/looting-glass.github.io
