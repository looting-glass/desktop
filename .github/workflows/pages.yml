name: Pages

# Publishes site/ to GitHub Pages (rockymontana.github.io/looting-glass). The desktop screenshots
# and icon are symlinks into docs/ and data/, so the README and the site share one copy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "data/icons/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve symlinks
        run: cp -rL site _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
