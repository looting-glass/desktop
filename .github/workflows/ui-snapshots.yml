name: UI snapshots

# Real Windows screenshots of the overlay, manual check and settings, in Windows light and dark
# mode. Uses the app's own snapshot mode (Qt renders the windows to images, no screen capture)
# and the mock API (no game, no network). Download the "ui-snapshots" artifact from the run.
on:
  workflow_dispatch:
  pull_request:
    paths: ["qml/**", "cpp/**", "src/bridge.rs", ".github/workflows/ui-snapshots.yml"]

permissions:
  contents: read

concurrency:
  group: ui-snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - name: Build
        run: cargo build --locked

      - name: Take screenshots in light and dark mode
        shell: pwsh
        run: |
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $personalize -Force | Out-Null
          foreach ($mode in "light", "dark") {
            # Windows' app colour mode, which Qt reads at startup.
            $light = [int]($mode -eq "light")
            Set-ItemProperty -Path $personalize -Name AppsUseLightTheme -Value $light -Type DWord
            Set-ItemProperty -Path $personalize -Name SystemUsesLightTheme -Value $light -Type DWord
            $out = (Join-Path $pwd "shots/$mode") -replace '\\', '/'
            New-Item -ItemType Directory -Force $out | Out-Null
            $env:LOOTINGGLASS_MOCK = "1"
            $env:LOOTINGGLASS_DEMO = "dev/boots.txt"
            $env:LOOTINGGLASS_SNAPSHOT = $out
            $p = Start-Process target/debug/lootingglass.exe -PassThru -RedirectStandardError "shots/$mode.log"
            # Snapshot mode saves the overlay, manual check and settings within ~10 s.
            for ($i = 0; $i -lt 45 -and (Get-ChildItem $out -Filter *.png).Count -lt 4; $i++) { Start-Sleep 1 }
            Stop-Process $p -ErrorAction SilentlyContinue
            "${mode}: $((Get-ChildItem $out -Filter *.png).Name -join ', ')"
          }
          if ((Get-ChildItem shots -Recurse -Filter *.png).Count -lt 8) { Get-Content shots/*.log; exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-snapshots
          path: shots/
