name: Build

# Builds, tests and packages Linux and Windows; the packages are uploaded as run artifacts.
# - Manual run (Actions tab or `gh workflow run build.yml --ref <branch>`): a test build of
#   any branch, versioned "<Cargo.toml version>-dev".
# - Called by release-please.yml with a release tag: builds that tag for the GitHub release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Arch packages current Qt 6, LayerShellQt and Kirigami; Qt 6 is backward compatible,
    # so the binary keeps working as users' Qt updates.
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust \
            qt6-base qt6-declarative layer-shell-qt kirigami qqc2-desktop-style

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Cache compiled dependencies between runs (keyed on Cargo.lock and the toolchain).
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          [[ -n "$version" ]] || version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"
          packaging/make-release.sh "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: lootlens-linux
          path: dist/*.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $version = "$env:TAG".TrimStart("v")
          if (-not $version) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value + "-dev"
          }
          $name = "lootlens-$version-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/lootlens.exe $dir/
          # windeployqt's --compiler-runtime finds the MSVC runtime DLLs through VCINSTALLDIR.
          # Set it only here: job-wide it makes rustc trust PATH's link.exe (Git's coreutils).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $env:VCINSTALLDIR = "$vs\VC\"
          windeployqt --release --qmldir qml --no-translations --compiler-runtime "$dir/lootlens.exe"
          if ($LASTEXITCODE) { exit 1 }
          # SVG icons (app icon, fallback UI icons) need the SVG image/icon plugins.
          New-Item -ItemType Directory -Force "$dir/imageformats", "$dir/iconengines" | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/bin/Qt6Svg.dll" $dir/
          Copy-Item "$env:QT_ROOT_DIR/plugins/imageformats/qsvg.dll" "$dir/imageformats/"
          Copy-Item "$env:QT_ROOT_DIR/plugins/iconengines/qsvgicon.dll" "$dir/iconengines/"
          Copy-Item README.md, LICENSE.md $dir/
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"

          # Installer (Inno Setup; installed on demand if the runner image lacks it).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $dir).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" packaging\windows\lootlens.iss
          if ($LASTEXITCODE) { exit 1 }

          foreach ($f in "$name.zip", "$name-setup.exe") {
            $hash = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii -NoNewline "dist/$f.sha256"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: lootlens-windows
          path: |
            dist/*.zip*
            dist/*-setup.exe*
