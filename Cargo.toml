[package]
name = "lootlens"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Wayland-native price checker for Path of Exile 1 & 2"
repository = "https://github.com/rockymontana/loot-lens"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.35"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "process"] }
toml = "1.2.1"

# Linux/KDE platform backend (src/platform/linux)
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.1", features = ["global_shortcuts", "remote_desktop", "screencast", "tokio"] }
png = "0.17"
ksni = "0.3.7"
wl-clipboard-rs = "0.9.5"

# Windows platform backend (src/platform/windows.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cxx-qt-build = "0.10.0"
